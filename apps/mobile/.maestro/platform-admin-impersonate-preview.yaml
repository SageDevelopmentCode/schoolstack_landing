appId: com.mudkitchen.schoolstack.mobile
env:
  E2E_PLATFORM_ADMIN_EMAIL: e2e-platform-admin@schoolstack.test
  E2E_TEST_PASSWORD: E2eTestPassword123!
---
- runFlow: platform-admin-login.yaml
- tapOn: 'Impersonate'
- tapOn: 'Rooted Meadows Waldorf School'
- extendedWaitUntil:
    visible: 'Back to schools'
    timeout: 15000
- tapOn: 'Parent'
- tapOn: 'Preview'
- extendedWaitUntil:
    visible: 'Read-only'
    timeout: 30000
- assertVisible: 'Previewing as'
- tapOn: 'Exit preview'
- extendedWaitUntil:
    visible: 'Impersonate'
    timeout: 15000
