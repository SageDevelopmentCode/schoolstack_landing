appId: com.mudkitchen.schoolstack.mobile
---
- runFlow: school-admin-logged-in.yaml
- tapOn: 'Admissions'
- extendedWaitUntil:
    visible: 'Alpha Child'
    timeout: 30000
- assertVisible: 'Beta Child'
# The "Ready to review" KPI tile filters to submitted applications (Beta Child is under review).
- tapOn:
    id: 'admissions-kpi-submitted'
- extendedWaitUntil:
    visible: 'Alpha Child'
    timeout: 30000
- assertNotVisible: 'Beta Child'
