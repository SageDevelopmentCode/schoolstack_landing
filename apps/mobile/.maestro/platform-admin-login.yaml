appId: com.mudkitchen.schoolstack.mobile
env:
  E2E_PLATFORM_ADMIN_EMAIL: e2e-platform-admin@schoolstack.test
  E2E_TEST_PASSWORD: E2eTestPassword123!
---
- runFlow: intro-to-login.yaml
- tapOn: 'Admin sign in'
- tapOn:
    text: 'Email'
- inputText: ${E2E_PLATFORM_ADMIN_EMAIL}
- tapOn:
    text: 'Password'
- inputText: ${E2E_TEST_PASSWORD}
- tapOn: 'Sign in'
- extendedWaitUntil:
    visible: 'Organizations'
    timeout: 30000
- assertVisible: 'Platform Admin'
