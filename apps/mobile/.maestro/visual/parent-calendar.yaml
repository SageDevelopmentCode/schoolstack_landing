appId: com.mudkitchen.schoolstack.mobile
---
- runFlow: ../parent-logged-in.yaml
- tapOn: 'Calendar / events'
- extendedWaitUntil:
    visible:
      id: parent-calendar-card
    timeout: 30000
- takeScreenshot: visual-capture
- tapOn:
    id: parent-calendar-view-week
- extendedWaitUntil:
    visible:
      id: parent-calendar-week-strip
    timeout: 10000
- takeScreenshot: visual-capture-week
- tapOn:
    id: parent-calendar-view-month
- extendedWaitUntil:
    visible:
      id: parent-calendar-month-grid
    timeout: 10000
- takeScreenshot: visual-capture-month
- tapOn:
    id: parent-calendar-next
- takeScreenshot: visual-capture-month-next
- tapOn:
    id: parent-calendar-today
- scrollUntilVisible:
    element:
      id: parent-calendar-agenda
    direction: DOWN
    optional: true
- takeScreenshot: visual-capture-agenda
