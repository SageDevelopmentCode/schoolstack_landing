appId: com.mudkitchen.schoolstack.mobile
---
- runFlow: ../parent-logged-in.yaml
- tapOn: 'More'
- tapOn: 'Attendance'
- extendedWaitUntil:
    visible:
      id: parent-attendance-screen
    timeout: 30000
- takeScreenshot: visual-capture
- scrollUntilVisible:
    element:
      id: parent-attendance-history-panel
    direction: DOWN
    optional: true
- takeScreenshot: visual-capture-history
