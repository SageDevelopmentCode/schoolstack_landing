appId: com.mudkitchen.schoolstack.mobile
---
- runFlow: ../parent-logged-in.yaml
- tapOn: 'Messages'
- extendedWaitUntil:
    visible: 'Messages'
    timeout: 30000
- takeScreenshot: visual-capture
- tapOn:
    id: parent-messages-new-button
- extendedWaitUntil:
    visible:
      id: new-conversation-search-input
    timeout: 15000
- takeScreenshot: visual-capture-new-conversation
- tapOn:
    id: new-conversation-search-input
- inputText: 'e2e'
- takeScreenshot: visual-capture-new-conversation-typing
- tapOn: 'Cancel'
- extendedWaitUntil:
    notVisible:
      id: new-conversation-search-input
    timeout: 15000
- tapOn:
    text: 'MudKitchen Support'
    optional: true
- extendedWaitUntil:
    visible: 'Write a message...'
    timeout: 15000
    optional: true
- tapOn:
    text: 'Write a message...'
    optional: true
- takeScreenshot: visual-capture-thread-compose
