appId: com.mudkitchen.schoolstack.mobile
---
- runFlow: ../parent-logged-in.yaml
- tapOn: 'Messages'
- extendedWaitUntil:
    visible: 'Messages'
    timeout: 30000
- takeScreenshot: visual-capture
- tapOn:
    text: 'MudKitchen Support'
    optional: true
- extendedWaitUntil:
    visible: 'Write a message...'
    timeout: 15000
    optional: true
- tapOn:
    text: 'Write a message...'
    optional: true
- takeScreenshot: visual-capture-thread-compose
