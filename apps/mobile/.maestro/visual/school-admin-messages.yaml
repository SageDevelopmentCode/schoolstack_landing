appId: com.mudkitchen.schoolstack.mobile
---
- runFlow: ../school-admin-logged-in.yaml
- tapOn: 'Messages'
- extendedWaitUntil:
    visible:
      id: admin-messages-inbox-header
    timeout: 30000
- takeScreenshot: visual-capture
- tapOn:
    id: admin-messages-new-button
- extendedWaitUntil:
    visible:
      id: admin-messages-new-conversation
    timeout: 15000
- takeScreenshot: visual-capture-compose-menu
- tapOn:
    id: admin-messages-new-conversation
- extendedWaitUntil:
    visible:
      id: new-conversation-search-input
    timeout: 15000
- takeScreenshot: visual-capture-new-conversation
- tapOn:
    id: new-conversation-search-input
- inputText: 'e2e'
- takeScreenshot: visual-capture-new-conversation-typing
- tapOn: 'Cancel'
- extendedWaitUntil:
    notVisible:
      id: new-conversation-search-input
    timeout: 15000
- tapOn:
    id: admin-messages-new-button
- extendedWaitUntil:
    visible: 'Bulk message'
    timeout: 15000
- tapOn: 'Bulk message'
- extendedWaitUntil:
    visible: 'Bulk message'
    timeout: 15000
- extendedWaitUntil:
    visible: 'PROGRAM'
    timeout: 15000
- takeScreenshot: visual-capture-bulk-recipients
