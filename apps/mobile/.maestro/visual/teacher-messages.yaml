appId: com.mudkitchen.schoolstack.mobile
---
- runFlow: ../teacher-logged-in.yaml
- tapOn: 'Messages'
- extendedWaitUntil:
    visible: 'Messages'
    timeout: 30000
- takeScreenshot: visual-capture
- tapOn:
    id: parent-messages-new-button
- extendedWaitUntil:
    visible:
      id: new-conversation-search-input
    timeout: 15000
- takeScreenshot: visual-capture-new-conversation
- tapOn:
    id: new-conversation-search-input
- inputText: 'e2e'
- takeScreenshot: visual-capture-new-conversation-typing
