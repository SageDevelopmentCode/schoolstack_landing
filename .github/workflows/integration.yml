name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: 2.20.12

      - name: Start local Supabase
        run: supabase start

      - name: Reset database
        run: supabase db reset

      - name: Load local Supabase keys
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status --output json | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "DISABLE_OUTBOUND_EMAIL=1" >> "$GITHUB_ENV"
          echo "STRIPE_WEBHOOK_SECRET=whsec_test_ci" >> "$GITHUB_ENV"
          echo "STRIPE_SECRET_KEY=sk_test_ci_dummy" >> "$GITHUB_ENV"
          echo "CI=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  notify:
    needs: integration
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    secrets:
      DISCORD_CI_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_CI_ALERTS_WEBHOOK_URL }}
    with:
      title: "Integration tests failed"
      details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
