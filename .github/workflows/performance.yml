name: Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Resolve Chromium path
        id: chrome-path
        run: echo "path=$(node -e "const { chromium } = require('@playwright/test'); console.log(chromium.executablePath())")" >> "$GITHUB_OUTPUT"

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CI: true

      - name: Run Lighthouse CI
        run: npm run performance:ci
        env:
          CI: true
          CHROME_PATH: ${{ steps.chrome-path.outputs.path }}

      - name: Upload Lighthouse CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci
          path: .lighthouseci/
          retention-days: 7

      - name: Upload results to Supabase
        if: success()
        run: npm run performance:ci:upload
        env:
          CI: true
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  notify:
    needs: lighthouse
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    secrets:
      DISCORD_CI_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_CI_ALERTS_WEBHOOK_URL }}
    with:
      title: "Performance CI failed"
      details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
