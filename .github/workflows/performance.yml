name: Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Reset database
        run: supabase db reset

      - name: Load local Supabase keys
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status --output json | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BASE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "DISABLE_OUTBOUND_EMAIL=1" >> "$GITHUB_ENV"
          echo "CI=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Prepare performance CI data
        run: npm run performance:ci:prepare

      - name: Allow Chromium user namespaces (Ubuntu 24.04+)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pinned Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: 141
          install-dependencies: true

      - name: Configure Chrome path
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CI: true
          DISABLE_OUTBOUND_EMAIL: "1"
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""
          ZOHO_CLIENT_ID: ""
          ZOHO_CLIENT_SECRET: ""
          ZOHO_REDIRECT_URI: ""
          ZOHO_REFRESH_TOKEN: ""
          ZOHO_ACCOUNT_ID: ""
          ZOHO_FROM_ADDRESS: ""
          ZOHO_SMTP_USER: ""
          ZOHO_SMTP_PASSWORD: ""

      - name: Run Lighthouse CI
        run: npm run performance:ci
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Lighthouse CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci
          path: .lighthouseci/
          retention-days: 7

      - name: Upload results to Supabase
        if: success()
        run: npm run performance:ci:upload
        env:
          CI: true
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  notify:
    needs: lighthouse
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    secrets:
      DISCORD_CI_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_CI_ALERTS_WEBHOOK_URL }}
    with:
      title: "Performance CI failed"
      details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
